name: Build and Push Docker Image

on:
  push:
    branches: [main, master]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-compose:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test stack
        run: docker compose -f docker-compose.test.yaml up -d

      - name: Inspect service status
        run: docker compose -f docker-compose.test.yaml ps

      - name: Wait for healthy services
        shell: bash
        run: |
          set -euo pipefail
          services=(db backend frontend)
          for service in "${services[@]}"; do
            container_id="$(docker compose -f docker-compose.test.yaml ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "Missing container for service: $service"
              exit 1
            fi

            for attempt in $(seq 1 30); do
              health_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
              if [ "$health_status" = "healthy" ]; then
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Service $service did not become healthy"
                docker compose -f docker-compose.test.yaml ps
                exit 1
              fi

              sleep 5
            done
          done

      - name: Curl health endpoints
        run: |
          curl -fsS http://localhost:80/
          curl -fsS http://localhost:8080/actuator/health

      - name: Final status check
        run: docker compose -f docker-compose.test.yaml ps

      - name: Cleanup test stack
        if: always()
        run: docker compose -f docker-compose.test.yaml down -v
