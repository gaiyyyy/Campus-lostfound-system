title = "Campus LostFound Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Ignore test fixtures, placeholder values, and generated coverage artifacts"
paths = [
  '''frontend/coverage/.*''',
  '''frontend/src/_tests_/.*''',
  '''backend/src/test/.*''',
  '''debug-ci-coverage-gitleaks\.md$''',
]
regexes = [
  '''change-me-[a-z0-9-]+''',
  '''your_api_key_here''',
  '''mock-jwt-token''',
  '''fake(?:-jwt)?-token(?:-\d+)?''',
  '''admin-token''',
]
